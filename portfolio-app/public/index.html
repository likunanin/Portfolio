<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lika Ninidze — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brandmark">
      <div class="seal">LN</div>
      <div class="name" id="nav-name">Lika Ninidze</div>
    </div>
    <div class="navlinks">
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#learning">Education</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" id="hero-eyebrow"></div>
      <h1 class="display" id="hero-name"></h1>
      <p class="role-line" id="hero-role"></p>
      <p class="tagline" id="hero-tagline"></p>
      <div class="hero-cta">
        <a class="btn btn-brass" id="hero-email" href="#">Email Me</a>
        <a class="btn btn-ghost" id="hero-phone" href="#"></a>
      </div>
    </div>

    <div class="rescard">
      <div class="rescard-top">
        <div>
          <div class="rescard-label">Guest</div>
          <div class="rescard-guest" id="card-guest"></div>
        </div>
        <div class="rescard-status" id="card-status"></div>
      </div>
      <div class="rescard-body" id="card-body"></div>
    </div>
  </div>
</header>

<section class="about" id="about">
  <div class="wrap">
    <div class="section-head"><span class="section-num">01</span><h2>About</h2><div class="section-rule"></div></div>
    <div class="about-grid reveal">
      <div class="about-copy" id="about-copy"></div>
      <div class="stat-grid" id="about-stats"></div>
    </div>
  </div>
</section>

<section class="experience" id="experience">
  <div class="wrap">
    <div class="section-head"><span class="section-num">02</span><h2>Work Experience</h2><div class="section-rule"></div></div>
    <div class="tickets" id="tickets"></div>
  </div>
</section>

<section class="skills" id="skills">
  <div class="wrap">
    <div class="section-head"><span class="section-num">03</span><h2>Skills &amp; Languages</h2><div class="section-rule"></div></div>
    <div class="tag-grid reveal" id="tag-grid"></div>
    <div class="lang-row reveal" id="lang-row"></div>
  </div>
</section>

<section class="learning" id="learning">
  <div class="wrap">
    <div class="section-head"><span class="section-num">04</span><h2>Education &amp; Courses</h2><div class="section-rule"></div></div>
    <div class="edu-card reveal" id="edu-card"></div>
    <div class="trail reveal" id="trail"><div class="trail-line"></div></div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <span class="section-num" style="color:#cfe8df;">05</span>
    <h2 class="display" id="contact-heading"></h2>
    <p id="contact-blurb"></p>
    <div class="contact-links" id="contact-links"></div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="/js/main.js"></script>
</body>
</html>
